services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kirtnix_tracker_app
    restart: unless-stopped
    ports:
      - "${TRACKER_PORT:-8000}:8000"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: base64:Kz5P+71g8c0Z4Ld4Y/tY/pZg+qZ4v6Bq9w8X1x0V2m8=
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
    networks:
      - kirtnix_network

networks:
  kirtnix_network:
    driver: bridge
